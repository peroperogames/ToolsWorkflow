name: 'AI Code Review'
description: 'AI-powered GitHub pull request review with conversation history and session persistence.'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token with pull-requests:write, issues:write and contents:read.'
    required: true
  openai-api-key:
    description: 'OpenAI-compatible API key.'
    required: true
  openai-model:
    description: 'Model to use.'
    required: false
    default: 'deepseek-v4-flash'
  openai-fallback-model:
    description: 'Fallback model used if the primary model fails or times out.'
    required: false
    default: 'glm-5.3-flash'
  openai-base-url:
    description: 'OpenAI-compatible API base URL.'
    required: false
    default: 'https://tokenhub.tencentmaas.com/plan/v3'
  openai-timeout:
    description: 'Seconds to wait for the connection to the API to be established. How long the model takes to answer is not limited.'
    required: false
    default: '15'
  openai-max-retries:
    description: 'Retry count for connection errors and 429/5xx responses.'
    required: false
    default: '5'
  review-language:
    description: 'Language for the review and replies (en, zh, cn, ja, ko, ...).'
    required: false
    default: 'en'
  max-tokens-per-chunk:
    description: 'Max tokens per chunk for large PRs.'
    required: false
    default: '131072'
  silent-mode:
    description: "Set 'true' to post a comment instead of a review. Only affects the prose-fallback path."
    required: false
    default: 'true'
  dry-run:
    description: "Set 'true' to print the review without posting anything."
    required: false
    default: 'false'
  state-dir:
    description: 'Root for the per-PR working directories (default: <tmp>/ai-code-review). Each PR gets one directory holding its agent session and its Unity project; both are deleted when the PR closes.'
    required: false
    default: ''
  project-prompt-path:
    description: 'Path to the reviewed repository''s own review criteria, read from the PR head. Empty to disable.'
    required: false
    default: '.github/ai-review.md'
  unity-editor-version:
    description: 'Editor version the per-PR Unity project is created for.'
    required: false
    default: '2022.3.62f3'
  unity-template:
    description: 'Template package the per-PR Unity project is created from.'
    required: false
    default: 'com.unity.template.3d'
  unity-sync-method:
    description: 'Optional -executeMethod used to regenerate project files (default: UnityEditor.SyncVS.SyncSolution).'
    required: false
    default: ''
  resharper-dotnet-sdk:
    description: 'Pin the .NET SDK whose MSBuild jb inspectcode uses (e.g. 10.0.300). Empty auto-detects, which picks the newest installed SDK and fails when that one cannot build the solution.'
    required: false
    default: ''
  resharper-build:
    description: "Set 'true' to let jb inspectcode build the solution before inspecting it. Off by default: the pipeline already compiled the code, and Unity's generated projects do not build cleanly under a generic MSBuild, which fails the step with no report at all."
    required: false
    default: ''
  resharper-ignore-rules:
    description: 'Comma-separated ReSharper naming rules to drop, e.g. "Unity serialized field". For a rule the analyser reports and the team''s IDE cannot show or silence.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # No pip install here: the runner is expected to carry Python and the
    # dependencies already (see the README's Requirements section).
    #
    # The pipeline is three steps, one process each, and the order is a
    # constraint rather than a preference: `review` settles the open threads and
    # approves, and nothing may post a finding after that.
    #
    # There is no `timeout-minutes` here. A composite action's steps do not
    # accept it — the runner rejects the whole manifest with "Unexpected value
    # 'timeout-minutes'" and no step runs at all — so the ceiling is the job's,
    # set by the calling workflow, and everything below it is bounded by the
    # deadlines the stages enforce on their own subprocesses.
    #
    # None of them is `continue-on-error`. A *finding* — a broken build, failing
    # tests, an analyzer that cannot run — is posted as a comment and still
    # exits 0, so the steps that follow do run. A *crash* stops the run, which is
    # what it should keep doing: turning that into a green job whose review
    # silently had no build results is the one outcome worth failing for.
    # The environment every stage runs in is settled by main.py itself rather than
    # by a block of shell here — see `prepare_environment`. It has to hold for the
    # stage that runs ReSharper as much as for the one that runs Unity, and a
    # comment path runs both inside the review step, so one place that every
    # process goes through is the only version that stays true.
    #
    # A closed pull request is not reviewed, so it is not reviewed here either:
    # one step, named for what it does, and none of the three that would say it
    # was built, analysed and read.
    - name: Delete the closed pull request's working directory
      if: github.event.action == 'closed'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_WORK_DIR: ${{ inputs.state-dir }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" cleanup

    - name: Build and test the pull request
      if: github.event.action != 'closed'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        REVIEW_WORK_DIR: ${{ inputs.state-dir }}
        UNITY_EDITOR_VERSION: ${{ inputs.unity-editor-version }}
        UNITY_TEMPLATE: ${{ inputs.unity-template }}
        UNITY_SYNC_METHOD: ${{ inputs.unity-sync-method }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" checks

    - name: Run the static analysis
      if: github.event.action != 'closed'
      shell: bash
      env:
        # No model key here on purpose: this stage runs the repository's own
        # .editorconfig and compilers, and never needs to talk to the model.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        REVIEW_WORK_DIR: ${{ inputs.state-dir }}
        INSPECT_DOTNET_SDK: ${{ inputs.resharper-dotnet-sdk }}
        INSPECT_BUILD: ${{ inputs.resharper-build }}
        INSPECT_IGNORE_RULES: ${{ inputs.resharper-ignore-rules }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" static

    # The reports are written inside the PR's directory on the runner, which
    # nobody can read afterwards. A failing run whose evidence cannot be looked
    # at is a failing run that gets re-run until it passes, so the reports and
    # the logs go up with the job: the NUnit XML, its captured output, the
    # editor's own log and ReSharper's, for fourteen days.
    #
    # The directory is not dot-prefixed on purpose. `upload-artifact` excludes
    # hidden files unless `include-hidden-files` is true, so a hidden directory
    # is searched and reported as "No files were found with the provided path"
    # even with eight report files in it.
    - name: Upload the reports
      id: upload-reports
      if: always() && github.event.action != 'closed'
      uses: actions/upload-artifact@v4
      with:
        name: ai-review-reports-${{ github.run_id }}-${{ github.run_attempt }}
        # Copied into the checkout by the stage that wrote them: the reports live
        # in the PR's directory under the system temp directory, and `$RUNNER_TEMP`
        # is a different directory on Linux — the first version of this step
        # uploaded nothing and said so only in its own log.
        path: ${{ github.workspace }}/ai-review-artifacts/
        if-no-files-found: ignore
        retention-days: 14

    # The comment was posted by the checks stage, before the artifacts existed, so
    # its link points at the run's artifact page. Now the upload knows the
    # artifact's own URL, and this step puts it there — the same comment, edited,
    # with a link that downloads instead of a page that lists.
    - name: Point the comment at the uploaded reports
      if: always() && github.event.action != 'closed'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_WORK_DIR: ${{ inputs.state-dir }}
        REVIEW_ARTIFACT_URL: ${{ steps.upload-reports.outputs.artifact-url }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" artifact-link

    - name: Review and settle the threads
      if: github.event.action != 'closed'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_API_MODEL: ${{ inputs.openai-model }}
        OPENAI_API_MODEL_FALLBACK: ${{ inputs.openai-fallback-model }}
        OPENAI_API_BASE_URL: ${{ inputs.openai-base-url }}
        OPENAI_TIMEOUT: ${{ inputs.openai-timeout }}
        OPENAI_MAX_RETRIES: ${{ inputs.openai-max-retries }}
        REVIEW_LANGUAGE: ${{ inputs.review-language }}
        MAX_TOKENS_PER_CHUNK: ${{ inputs.max-tokens-per-chunk }}
        SILENT_MODE: ${{ inputs.silent-mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        REVIEW_WORK_DIR: ${{ inputs.state-dir }}
        PROJECT_PROMPT_PATH: ${{ inputs.project-prompt-path }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" review
