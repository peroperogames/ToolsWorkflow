name: AI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      openai-model:
        description: 'OpenAI model to use for the review'
        required: false
        type: string
        default: 'deepseek-v4-flash'
      openai-fallback-model:
        description: 'Fallback model used if the primary model fails or times out.'
        required: false
        type: string
        default: 'glm-5.3-flash'
      openai-base-url:
        description: 'OpenAI API base URL (for custom endpoints or proxies)'
        required: false
        type: string
        default: 'https://tokenhub.tencentmaas.com/plan/v3'
      openai-timeout:
        description: 'API request timeout in seconds'
        required: false
        type: string
        default: '180'
      openai-max-retries:
        description: 'Retry count for timeouts/429/5xx errors'
        required: false
        type: string
        default: '5'
      review-language:
        description: 'Language of the review comment (e.g. en, zh, ja, ko, es, fr, de, ru, pt)'
        required: false
        type: string
        default: 'cn'
      max-tokens-per-chunk:
        description: 'Max tokens of diff per review call, for large pull requests'
        required: false
        type: string
        default: '131072'
      silent-mode:
        description: "Set 'true' to post a comment instead of a review. Only affects the prose-fallback path; the normal tool-driven review posts inline comments regardless."
        required: false
        type: string
        default: 'true'
      dry-run:
        description: "Set 'true' to print the review without posting anything — useful for trying the bot out on a pull request"
        required: false
        type: string
        default: 'false'
      state-dir:
        description: 'Directory for per-PR session/history files (default: <tmp>/ai-code-review)'
        required: false
        type: string
        default: ''
      project-prompt-path:
        description: |
          Path to this repository's own review criteria, relative to the repo root.
          Read from the pull request's head and added to the built-in prompt; it can
          add criteria but cannot change the tool contract or the output format.
          Pass an empty string to use the built-in prompt alone.
        required: false
        type: string
        default: '.github/ai-review.md'
    secrets:
      OPENAI_API_KEY:
        required: true   # OpenAI API key
      APP_ID:
        required: true   # GitHub App ID (used to generate a token)
      APP_PK:
        required: true   # GitHub App private key

jobs:
  review:
    runs-on: [build-server, unitypkg-share]
    steps:
      - name: Generate token via GitHub App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: ${{ github.event.repository.name }}, ToolsWorkflow

      - name: Run AI code review
        uses: peroperogames/ToolsWorkflow/review@main
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: ${{ inputs.openai-model }}
          openai-fallback-model: ${{ inputs.openai-fallback-model }}
          openai-base-url: ${{ inputs.openai-base-url }}
          openai-timeout: ${{ inputs.openai-timeout }}
          openai-max-retries: ${{ inputs.openai-max-retries }}
          review-language: ${{ inputs.review-language }}
          max-tokens-per-chunk: ${{ inputs.max-tokens-per-chunk }}
          silent-mode: ${{ inputs.silent-mode }}
          dry-run: ${{ inputs.dry-run }}
          state-dir: ${{ inputs.state-dir }}
          project-prompt-path: ${{ inputs.project-prompt-path }}
