name: AI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      openai-model:
        description: 'OpenAI model to use for the review'
        required: false
        type: string
        default: 'deepseek-v4-flash'
      openai-fallback-model:
        description: 'Fallback model used if the primary model fails or times out.'
        required: false
        type: string
        default: 'glm-5.3-flash'
      openai-base-url:
        description: 'OpenAI API base URL (for custom endpoints or proxies)'
        required: false
        type: string
        default: 'https://tokenhub.tencentmaas.com/plan/v3'
      review-language:
        description: 'Language of the review comment (e.g. en, zh, ja, ko, es, fr, de, ru, pt)'
        required: false
        type: string
        default: 'cn'
      project-prompt-path:
        description: |
          Path to this repository's own review criteria, relative to the repo root.
          Read from the pull request's head and added to the built-in prompt; it can
          add criteria but cannot change the tool contract or the output format.
          Pass an empty string to use the built-in prompt alone.
        required: false
        type: string
        default: '.github/ai-review.md'
    secrets:
      OPENAI_API_KEY:
        required: true   # OpenAI API key
      APP_ID:
        required: true   # GitHub App ID (used to generate a token)
      APP_PK:
        required: true   # GitHub App private key

jobs:
  review:
    runs-on: [build-server, unitypkg-share]
    steps:
      - name: Generate token via GitHub App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: ${{ github.event.repository.name }}, ToolsWorkflow

      - name: Run AI code review
        uses: peroperogames/ToolsWorkflow/review@main
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: ${{ inputs.openai-model }}
          openai-fallback-model: ${{ inputs.openai-fallback-model }}
          openai-base-url: ${{ inputs.openai-base-url }}
          review-language: ${{ inputs.review-language }}
          project-prompt-path: ${{ inputs.project-prompt-path }}
