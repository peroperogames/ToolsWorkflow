name: token probe (temporary)

# One-off diagnostic, deleted as soon as it answers: the App token can read
# RhythmAce-Neo's API (200 on /repos, /pulls/36, /contents) but `git ls-remote`
# answers "Repository not found", and the review pipeline's clone fails the same
# way. This mints one token scoped to three repositories and asks git about each,
# so the answer says whether it is that repository or the token everywhere.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One token, three repositories
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: AccessKing, RhythmAce-Neo, ToolsWorkflow

      - name: Ask git about each of them
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "-- repositories the token is scoped to"
          curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories \
            | jq -r '"total_count=\(.total_count)", (.repositories[]?.full_name)'
          for repo in AccessKing RhythmAce-Neo ToolsWorkflow; do
            echo "-- $repo"
            curl -sS -o /dev/null -w "   /repos -> %{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/peroperogames/$repo"
            GIT_TERMINAL_PROMPT=0 git ls-remote \
              "https://x-access-token:${TOKEN}@github.com/peroperogames/$repo.git" HEAD 2>&1 | tail -2
          done
