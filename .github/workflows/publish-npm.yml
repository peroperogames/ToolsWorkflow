name: Publish Package (Reusable)

on:
  workflow_call:
    inputs:
      channels:
        description: >-
          Publish channels, comma separated: peronpm (the default), npmjs, nuget.
          PeroNPM is the registry these packages are read from, so it publishes
          unless the caller names a list without it; npmjs and nuget are opt-in.
        required: false
        type: string
        default: 'peronpm'
      nuget-project:
        description: >-
          The .csproj or .sln the nuget channel packs, relative to
          working-directory. Only used when the nuget channel is named.
        required: false
        type: string
        default: ''
      nuget-source:
        description: 'The NuGet feed the nuget channel pushes to'
        required: false
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      expected-package-prefix:
        description: 'Expected package name prefix (used in scripts)'
        required: false
        type: string
        default: 'com.prpr'
      node-version:
        description: 'Node.js version used to pack and publish'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Subdirectory to cd into after checkout (relative to repo root). Defaults to repo root.'
        required: false
        type: string
        default: '.'
    secrets:
      APP_ID:
        required: true   # GitHub App ID
      APP_PK:
        required: true   # GitHub App private key
      FEISHU_WEBHOOK:
        required: true   # Feishu webhook URL
      FEISHU_SECRET:
        required: true   # Feishu secret
      # Every channel brings its own credentials, so none of the three below is
      # required by the workflow itself: one that is `required: true` would fail a
      # caller that publishes only to the other channels, since GitHub validates
      # the caller's secrets before it runs anything. resolve_channels.sh refuses a
      # channel whose credentials are missing, by name, before the build starts.
      NPM_URL:
        required: false  # PeroNPM registry URL — the peronpm channel
      NPMJS_TOKEN:
        required: false  # npm token for registry.npmjs.org — the npmjs channel
      NUGET_API_KEY:
        required: false  # nuget.org API key — the nuget channel

permissions:
  contents: write

jobs:
  publish:
    runs-on: [build-server, unitypkg-share]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      EXPECTED_PACKAGE_PREFIX: ${{ inputs.expected-package-prefix || 'com.prpr' }}
      NPM_URL: ${{ secrets.NPM_URL }}
      # The ci_cd checkout goes under the runner's own writable scratch space —
      # `$RUNNER_TEMP`, which every step gets as an environment variable. It used
      # to be /devops, at the filesystem root: the job runs as the runner's user,
      # not root, so `mkdir -p /devops` is a permission error and the publish
      # stops before anything is cloned. (The `runner` context cannot be used
      # here — job-level `env` does not allow it — which is why this is a plain
      # shell variable in the steps below.)

    steps:
      - name: Generate token via GitHub App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: ${{ github.event.repository.name }}, ToolsWorkflow

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Clone ci_cd repository
        run: |
          mkdir -p "$RUNNER_TEMP/devops"
          git clone https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/peroperogames/ToolsWorkflow.git "$RUNNER_TEMP/devops/ToolsWorkflow"

      # Which registries this release goes to, decided before anything is built or
      # committed: an unknown channel name, a missing token or a missing project
      # stops the run here rather than after the version bump has been pushed.
      - name: Resolve the publish channels
        env:
          CHANNELS: ${{ inputs.channels }}
          NUGET_PROJECT: ${{ inputs.nuget-project }}
          NPM_URL: ${{ secrets.NPM_URL }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/resolve_channels.sh"

      # Packed here, before the packaging renames anything: changefoldername.sh puts
      # a `~` on the folders package.json refers to, and a project inside one of
      # them would no longer be at the path the repository names. The version on the
      # command line is the tag's, and a global property wins over whatever the
      # project or a .props file says, so the package is the release's version even
      # though the properties are only bumped two steps later.
      - name: Pack the NuGet packages
        if: ${{ env.DO_NUGET == 'true' }}
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          NUGET_PROJECT: ${{ inputs.nuget-project }}
        run: |
          if ! command -v dotnet > /dev/null 2>&1; then
            echo "::error::The nuget channel needs the .NET SDK and there is no dotnet on this runner."
            exit 1
          fi
          if [ ! -e "$NUGET_PROJECT" ]; then
            echo "::error::No '$NUGET_PROJECT' in $(pwd) — the nuget-project input names the .csproj or .sln to pack."
            exit 1
          fi
          source "$RUNNER_TEMP/devops/ToolsWorkflow/publish/version_from_tag.sh"
          NEW_VERSION=$(extract_version "$CI_COMMIT_TAG") || exit 1
          echo "dotnet $(dotnet --version); packing $NUGET_PROJECT as $NEW_VERSION"
          # Emptied first: a .nupkg left behind by an earlier run on this runner
          # would be pushed as if this release had built it.
          rm -rf "$RUNNER_TEMP/nuget"
          mkdir -p "$RUNNER_TEMP/nuget"
          dotnet pack "$NUGET_PROJECT" -c Release -o "$RUNNER_TEMP/nuget" \
            -p:Version="$NEW_VERSION" -p:PackageVersion="$NEW_VERSION"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/nuget"/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::dotnet pack produced no .nupkg — is '$NUGET_PROJECT' packable (IsPackable, or is it a test project)?"
            exit 1
          fi
          printf 'packed: %s\n' "${packages[@]}"

      - name: Change folder name
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/changefoldername.sh"

      - name: Package preprocess
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/package_preprocess.sh"

      # The install snippet in a README is the same fact as package.json, written
      # down twice, and it goes stale silently — AccessKing's still said 0.2.5 two
      # releases later. Rewritten here so it lands in the same commit as the bump.
      - name: Update the README's version
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_NAME=$(grep '"name"' package.json | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/')
          NEW_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "package: $PACKAGE_NAME, version: $NEW_VERSION, tag: $CI_COMMIT_TAG"
          # The npm/OpenUPM snippets want the published version; a `git#…` URL wants
          # the tag, which is the ref a consumer can resolve — `0.3.0` and
          # `0.3.0-base` are not the same string.
          PACKAGE_NAME="$PACKAGE_NAME" NEW_VERSION="$NEW_VERSION" GIT_REF="$CI_COMMIT_TAG" \
            bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/update_readme_version.sh" README.md

      # The same version again, in whatever assembly/package properties the
      # repository keeps — `<Version>`, `<AssemblyVersion>`, `<FileVersion>` in a
      # .csproj or in a shared .props. Nothing else bumps those, so they drift.
      - name: Update the assembly version properties
        run: |
          NEW_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          # The list of files it changed, which the commit step stages. The
          # runner's scratch directory, because the working tree is dirty with the
          # packaging and a stray file in it could end up in the tarball.
          VERSION_FILE_LIST="$RUNNER_TEMP/version-files.txt" NEW_VERSION="$NEW_VERSION" \
            bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/update_version_properties.sh"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version update
        id: commit_version
        run: |
          NEW_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          # The files this bump is made of: the manifest, the README whose install
          # snippet repeats it, and whatever assembly-version properties the
          # previous step rewrote.
          FILES=(package.json)
          if [ -f README.md ]; then FILES+=(README.md); fi
          if [ -s "$RUNNER_TEMP/version-files.txt" ]; then
            while IFS= read -r path; do FILES+=("$path"); done < "$RUNNER_TEMP/version-files.txt"
          fi
          # `--only` commits exactly these paths and leaves the rest of the index
          # alone: the packaging has already moved folders and deleted .meta files
          # in the working tree, and a plain `git commit` would take whatever is
          # staged with it.
          if git diff --quiet -- "${FILES[@]}"; then
            echo "No changes to commit"
          else
            git commit --only -m "chore: update package version to $NEW_VERSION." -- "${FILES[@]}"
            echo "committed=true" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: ${{ env.committed == 'true' }}
        env:
            TAG: ${{ github.event.release.tag_name }}
        run: |
          # The branch which the release was cut from, which is the one it names, and failing that the one which holds
          # the commit which was tagged. A release published from a tag which was pushed by hand names the tag here
          # rather than a branch, so what it names is not taken on trust.
          TARGET="${{ github.event.release.target_commitish }}"
          if ! git ls-remote --exit-code --heads origin "$TARGET" > /dev/null 2>&1; then
              TAGGED=$(git rev-parse "$TAG^{commit}")
              # The branch which points at the tagged commit, which is the branch the tag was cut from.
              TARGET=$(git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin \
                       | sed 's|^origin/||' | grep -v '^HEAD ' \
                       | awk -v commit="$TAGGED" '$2 == commit { print $1 }' | head -1)
             if [ -z "$TARGET" ]; then
                TARGET=$(git branch -r --contains "$TAG" --format='%(refname:short)' | sed 's|^origin/||' | grep -v '^HEAD$' | head -1)
             fi
           fi
           echo "pushing to $TARGET"

           # The bump was committed on the tagged commit, and the branch may have
           # moved since the release was cut — the push of that commit is then a
           # non-fast-forward and GitHub rejects it ("a pushed branch tip is
           # behind its remote counterpart"). Rebase it onto the branch tip so the
           # push is a fast-forward.
           #
           # The working tree is dirty on purpose at this point: the packaging
           # steps renamed folders and deleted their .meta files, and none of that
           # is meant to be committed. It is set aside for the rebase and put back
           # afterwards, before the publish reads the tree.
           git fetch origin "$TARGET"
           DIRTY=0
           if [ -n "$(git status --porcelain)" ]; then
             git stash push --include-untracked -m publish-packaging > /dev/null
             DIRTY=1
           fi
           if ! git rebase "origin/$TARGET"; then
             git rebase --abort || true
             if [ "$DIRTY" = 1 ]; then
               git stash pop > /dev/null || echo "::warning::the packaging changes could not be restored after the failed rebase"
             fi
             echo "::error::The version bump does not rebase onto origin/$TARGET — package.json changed on the branch after this release was cut. Resolve it by hand and re-run; forcing the push would drop those commits."
             exit 1
           fi
           if [ "$DIRTY" = 1 ]; then
             git stash pop > /dev/null || echo "::warning::the packaging changes could not be restored (git stash pop); the publish will use the tree as it is"
           fi

           git push https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/${{ github.repository }} HEAD:"$TARGET"
           git tag -f "$TAG"
           git push -f origin "$TAG"

      - name: Setup Node.js
        if: ${{ env.DO_PERONPM == 'true' || env.DO_NPMJS == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check npm auth
        if: ${{ env.DO_PERONPM == 'true' || env.DO_NPMJS == 'true' }}
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          # The login lives in the job user's own ~/.npmrc, done once by hand on
          # the runner. Reading /root/.npmrc (what this step used to do) can only
          # ever print "No such file": the job does not run as root, and that made
          # a missing login look exactly like a broken registry.
          if [ -f "$HOME/.npmrc" ]; then
            echo "found $HOME/.npmrc; registries with credentials:"
            grep -oE '^//[^:]+:' "$HOME/.npmrc" || true
          else
            echo "::warning::no $HOME/.npmrc — npm login has not been run for $(id -un) on this runner"
          fi
          # Fails loudly now rather than after three retries of the real publish.
          if [ "$DO_PERONPM" = true ]; then
            npm whoami --registry "$NPM_URL" || echo "::warning::npm whoami failed — the PeroNPM publish will fail the same way"
          fi
          if [ "$DO_NPMJS" = true ]; then
            # A scratch .npmrc of its own: writing the public registry's token into
            # ~/.npmrc would replace the PeroNPM login this runner already has.
            NPMRC=$(bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/npmjs_auth.sh") || exit 1
            npm whoami --userconfig "$NPMRC" --registry https://registry.npmjs.org/ \
              || echo "::warning::npm whoami failed on registry.npmjs.org — the npmjs publish will fail the same way"
          fi

      - name: Publish to PeroNPM
        if: ${{ env.DO_PERONPM == 'true' }}
        run: |
          for i in {1..3}; do
            npm publish --registry "$NPM_URL" --verbose && exit 0
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      # The same tarball, to the public registry. `--userconfig` keeps the two
      # logins apart; a scoped name has to say `--access public` explicitly or npm
      # publishes it private and fails on a free account.
      - name: Publish to npmjs
        if: ${{ env.DO_NPMJS == 'true' }}
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          NPMRC=$(bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/npmjs_auth.sh") || exit 1
          PACKAGE_NAME=$(grep '"name"' package.json | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/')
          ACCESS=()
          case "$PACKAGE_NAME" in
            @*) ACCESS=(--access public) ;;
          esac
          echo "publishing $PACKAGE_NAME to registry.npmjs.org"
          for i in {1..3}; do
            npm publish --userconfig "$NPMRC" --registry https://registry.npmjs.org/ "${ACCESS[@]}" && exit 0
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      - name: Push the NuGet packages
        if: ${{ env.DO_NUGET == 'true' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ inputs.nuget-source }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/nuget/*.nupkg)
          # A step that pushes nothing must not report success — the pack step
          # already refuses an empty output directory, so reaching this with none
          # means the two steps disagree about where the packages are.
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::There is no .nupkg in $RUNNER_TEMP/nuget to push."
            exit 1
          fi
          for package in "${packages[@]}"; do
            echo "pushing $(basename "$package") to $NUGET_SOURCE"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              # `--skip-duplicate` makes a re-run of the same release succeed: the
              # version is already there and there is nothing to push.
              if dotnet nuget push "$package" --source "$NUGET_SOURCE" \
                   --api-key "$NUGET_API_KEY" --skip-duplicate; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not push $(basename "$package") to $NUGET_SOURCE after 3 attempts."
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 5 seconds..."
              attempt=$((attempt + 1))
              sleep 5
            done
          done

      - name: Send Feishu notification
        if: success() && endsWith(github.ref_name, '-base') #  (only for -base)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          RELEASE_NOTES=$(gh release view "$TAG" --json body --jq .body)
          README_URL="https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md"
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/feishu_webhook.sh" "$FEISHU_WEBHOOK" "$FEISHU_SECRET" "$PROJECT_NAME" "$TAG" "$RELEASE_NOTES" "$README_URL"

      - name: Clean up the ci_cd checkout
        if: always() && github.actor != 'perotoolsbot[bot]'
        run: |
          rm -rf "$RUNNER_TEMP/devops"
          # the scratch npmjs login, and the packages whose push already happened
          rm -f "$RUNNER_TEMP/npmrc-npmjs"
          rm -rf "$RUNNER_TEMP/nuget"
