name: Publish Package (Reusable)

on:
  workflow_call:
    inputs:
      channels:
        description: >-
          Publish channels, comma separated: peronpm (the default), npmjs, nuget.
          PeroNPM is the registry these packages are read from, so it publishes
          unless the caller names a list without it; npmjs and nuget are opt-in.
        required: false
        type: string
        default: 'peronpm'
      nuget-project:
        description: >-
          The .csproj or .sln the nuget channel packs, relative to the
          REPOSITORY ROOT — not to working-directory, because a package whose
          manifest lives in a subdirectory usually keeps its projects beside it
          rather than inside it. Only used when the nuget channel is named.
        required: false
        type: string
        default: ''
      nuget-user:
        description: >-
          The nuget.org profile name the trusted publishing policy belongs to.
          Only used when the nuget channel is named.
        required: false
        type: string
        default: ''
      nuget-source:
        description: 'The NuGet feed the nuget channel pushes to'
        required: false
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      expected-package-prefix:
        description: 'Expected package name prefix (used in scripts)'
        required: false
        type: string
        default: 'com.prpr'
      node-version:
        description: 'Node.js version used to pack and publish to PeroNPM'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Subdirectory to cd into after checkout (relative to repo root). Defaults to repo root.'
        required: false
        type: string
        default: '.'
    secrets:
      APP_ID:
        required: true   # GitHub App ID
      APP_PK:
        required: true   # GitHub App private key
      FEISHU_WEBHOOK:
        required: true   # Feishu webhook URL
      FEISHU_SECRET:
        required: true   # Feishu secret
      # PeroNPM is reached with a login that already lives on the runner, not with
      # a secret of its own; only the registry's address comes in here. It is
      # optional so that a caller publishing to npmjs or nuget alone need not
      # hold it.
      NPM_URL:
        required: false  # PeroNPM registry URL — the peronpm channel
  # The other two channels authenticate with OIDC trusted publishing, so this
  # workflow holds no token for either registry. Two things live in the calling
  # repository instead:
  #
  #   * `permissions: id-token: write` on the calling job — GitHub only issues the
  #     OIDC token when the caller asks for it, and a called workflow cannot grant
  #     itself permission the caller did not give.
  #   * the trusted publisher configuration on npmjs.com / nuget.org, which names
  #     the CALLING workflow's file (for `workflow_ref`-checked registries) rather
  #     than this one.
  #
  # The `external` job prints the identity claims it publishes under, so which
  # file to configure can be read off a run instead of guessed.

permissions:
  contents: read

jobs:
  # Everything that needs the repository: the version bump, PeroNPM, and the two
  # kinds of package the other registries receive. It runs on the self-hosted
  # runners the PeroNPM login and the .NET SDK live on — npm trusted publishing
  # does not accept self-hosted runners, which is why the other two channels are
  # somewhere else.
  publish:
    runs-on: [build-server, unitypkg-share]
    permissions:
      contents: write
    outputs:
      npmjs: ${{ steps.channels.outputs.DO_NPMJS }}
      nuget: ${{ steps.channels.outputs.DO_NUGET }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      EXPECTED_PACKAGE_PREFIX: ${{ inputs.expected-package-prefix || 'com.prpr' }}
      NPM_URL: ${{ secrets.NPM_URL }}
      # The ci_cd checkout goes under the runner's own writable scratch space —
      # `$RUNNER_TEMP`, which every step gets as an environment variable. It used
      # to be /devops, at the filesystem root: the job runs as the runner's user,
      # not root, so `mkdir -p /devops` is a permission error and the publish
      # stops before anything is cloned. (The `runner` context cannot be used
      # here — job-level `env` does not allow it — which is why this is a plain
      # shell variable in the steps below.)

    steps:
      - name: Generate token via GitHub App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: ${{ github.event.repository.name }}, ToolsWorkflow

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      - name: Clone ci_cd repository
        run: |
          mkdir -p "$RUNNER_TEMP/devops"
          git clone https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/peroperogames/ToolsWorkflow.git "$RUNNER_TEMP/devops/ToolsWorkflow"

      # Which registries this release goes to, decided before anything is built or
      # committed: an unknown channel name or a missing project stops the run here
      # rather than after the version bump has been pushed. The answers travel to
      # the other jobs as this job's outputs.
      - name: Resolve the publish channels
        id: channels
        env:
          CHANNELS: ${{ inputs.channels }}
          NUGET_PROJECT: ${{ inputs.nuget-project }}
          NUGET_USER: ${{ inputs.nuget-user }}
          NPM_URL: ${{ secrets.NPM_URL }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/resolve_channels.sh"

      # Packed here, before the packaging renames anything: changefoldername.sh puts
      # a `~` on the folders package.json refers to, and a project inside one of
      # them would no longer be at the path the repository names. The version on the
      # command line is the tag's, and a global property wins over whatever the
      # project or a .props file says, so the package is the release's version even
      # though the properties are only bumped two steps later.
      - name: Pack the NuGet packages
        if: ${{ steps.channels.outputs.DO_NUGET == 'true' }}
        # From the repository root rather than the package directory: the projects
        # usually sit beside the package manifest, not inside it, so the path in
        # `nuget-project` means what the repository shows.
        working-directory: ${{ github.workspace }}
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          NUGET_PROJECT: ${{ inputs.nuget-project }}
        run: |
          if ! command -v dotnet > /dev/null 2>&1; then
            echo "::error::The nuget channel needs the .NET SDK and there is no dotnet on this runner."
            exit 1
          fi
          if [ ! -e "$NUGET_PROJECT" ]; then
            echo "::error::No '$NUGET_PROJECT' at the repository root — the nuget-project input names the .csproj or .sln to pack, relative to the repository root."
            exit 1
          fi
          source "$RUNNER_TEMP/devops/ToolsWorkflow/publish/version_from_tag.sh"
          NEW_VERSION=$(extract_version "$CI_COMMIT_TAG") || exit 1
          echo "dotnet $(dotnet --version); packing $NUGET_PROJECT as $NEW_VERSION"
          # Emptied first: a .nupkg left behind by an earlier run on this runner
          # would be pushed as if this release had built it.
          rm -rf "$RUNNER_TEMP/nuget"
          mkdir -p "$RUNNER_TEMP/nuget"
          dotnet pack "$NUGET_PROJECT" -c Release -o "$RUNNER_TEMP/nuget" \
            -p:Version="$NEW_VERSION" -p:PackageVersion="$NEW_VERSION"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/nuget"/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::dotnet pack produced no .nupkg — is '$NUGET_PROJECT' packable (IsPackable, or is it a test project)?"
            exit 1
          fi
          printf 'packed: %s\n' "${packages[@]}"

      - name: Change folder name
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/changefoldername.sh"

      - name: Package preprocess
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/package_preprocess.sh"

      # The install snippet in a README is the same fact as package.json, written
      # down twice, and it goes stale silently — AccessKing's still said 0.2.5 two
      # releases later. Rewritten here so it lands in the same commit as the bump.
      #
      # Two READMEs can carry it: the package's own (which npm shows) and the
      # repository's, which is where AccessKing writes its install snippets — the
      # package lives in `Unity/` and the README it belongs to sits above it. The
      # step therefore works from the repository root and reads the manifest through
      # the package directory.
      - name: Update the README's version
        working-directory: ${{ github.workspace }}
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          PACKAGE_DIR: ${{ inputs.working-directory }}
        run: |
          PACKAGE_NAME=$(grep '"name"' "$PACKAGE_DIR/package.json" | head -1 | sed 's/.*"name": *"\([^"]*\)".*/\1/')
          NEW_VERSION=$(grep '"version"' "$PACKAGE_DIR/package.json" | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "package: $PACKAGE_NAME, version: $NEW_VERSION, tag: $CI_COMMIT_TAG"
          # The npm/OpenUPM snippets want the published version; a `git#…` URL wants
          # the tag, which is the ref a consumer can resolve — `0.3.0` and
          # `0.3.0-base` are not the same string.
          candidates=("$PACKAGE_DIR/README.md")
          if [ "$PACKAGE_DIR" != "." ]; then candidates+=(README.md); fi
          for readme in "${candidates[@]}"; do
            PACKAGE_NAME="$PACKAGE_NAME" NEW_VERSION="$NEW_VERSION" GIT_REF="$CI_COMMIT_TAG" \
              bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/update_readme_version.sh" "$readme"
          done

      # The same version again, in whatever assembly/package properties the
      # repository keeps — `<Version>`, `<AssemblyVersion>`, `<FileVersion>` in a
      # .csproj or in a shared .props. Nothing else bumps those, so they drift.
      #
      # From the repository root, because the .NET side of a package usually sits
      # beside the package directory rather than inside it: AccessKing's manifest is
      # in `Unity/` and its project at `Core/`, and a scan of the package directory
      # only ever found one of them.
      - name: Update the assembly version properties
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_DIR: ${{ inputs.working-directory }}
        run: |
          NEW_VERSION=$(grep '"version"' "$PACKAGE_DIR/package.json" | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          # The list of files it changed, which the commit step stages. The
          # runner's scratch directory, because the working tree is dirty with the
          # packaging and a stray file in it could end up in the tarball.
          VERSION_FILE_LIST="$RUNNER_TEMP/version-files.txt" NEW_VERSION="$NEW_VERSION" \
            bash "$RUNNER_TEMP/devops/ToolsWorkflow/publish/update_version_properties.sh"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Also from the repository root: git resolves the pathspecs below against the
      # current directory, so a manifest in `Unity/` and a project at `Core/` cannot
      # both be named from inside the package directory.
      - name: Commit version update
        id: commit_version
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_DIR: ${{ inputs.working-directory }}
        run: |
          NEW_VERSION=$(grep '"version"' "$PACKAGE_DIR/package.json" | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          # The files this bump is made of: the manifest, whichever READMEs carry
          # the install snippet, and whatever assembly-version properties the
          # previous step rewrote.
          FILES=("$PACKAGE_DIR/package.json")
          if [ -f "$PACKAGE_DIR/README.md" ]; then FILES+=("$PACKAGE_DIR/README.md"); fi
          if [ "$PACKAGE_DIR" != "." ] && [ -f README.md ]; then FILES+=(README.md); fi
          if [ -s "$RUNNER_TEMP/version-files.txt" ]; then
            while IFS= read -r path; do FILES+=("$path"); done < "$RUNNER_TEMP/version-files.txt"
          fi
          # `--only` commits exactly these paths and leaves the rest of the index
          # alone: the packaging has already moved folders and deleted .meta files
          # in the working tree, and a plain `git commit` would take whatever is
          # staged with it.
          if git diff --quiet -- "${FILES[@]}"; then
            echo "No changes to commit"
          else
            git commit --only -m "chore: update package version to $NEW_VERSION." -- "${FILES[@]}"
            echo "committed=true" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: ${{ env.committed == 'true' }}
        env:
            TAG: ${{ github.event.release.tag_name }}
        run: |
          # The branch which the release was cut from, which is the one it names, and failing that the one which holds
          # the commit which was tagged. A release published from a tag which was pushed by hand names the tag here
          # rather than a branch, so what it names is not taken on trust.
          TARGET="${{ github.event.release.target_commitish }}"
          if ! git ls-remote --exit-code --heads origin "$TARGET" > /dev/null 2>&1; then
              TAGGED=$(git rev-parse "$TAG^{commit}")
              # The branch which points at the tagged commit, which is the branch the tag was cut from.
              TARGET=$(git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin \
                       | sed 's|^origin/||' | grep -v '^HEAD ' \
                       | awk -v commit="$TAGGED" '$2 == commit { print $1 }' | head -1)
             if [ -z "$TARGET" ]; then
                TARGET=$(git branch -r --contains "$TAG" --format='%(refname:short)' | sed 's|^origin/||' | grep -v '^HEAD$' | head -1)
             fi
           fi
           echo "pushing to $TARGET"

           # The bump was committed on the tagged commit, and the branch may have
           # moved since the release was cut — the push of that commit is then a
           # non-fast-forward and GitHub rejects it ("a pushed branch tip is
           # behind its remote counterpart"). Rebase it onto the branch tip so the
           # push is a fast-forward.
           #
           # The working tree is dirty on purpose at this point: the packaging
           # steps renamed folders and deleted their .meta files, and none of that
           # is meant to be committed. It is set aside for the rebase and put back
           # afterwards, before the publish reads the tree.
           git fetch origin "$TARGET"
           DIRTY=0
           if [ -n "$(git status --porcelain)" ]; then
             git stash push --include-untracked -m publish-packaging > /dev/null
             DIRTY=1
           fi
           if ! git rebase "origin/$TARGET"; then
             git rebase --abort || true
             if [ "$DIRTY" = 1 ]; then
               git stash pop > /dev/null || echo "::warning::the packaging changes could not be restored after the failed rebase"
             fi
             echo "::error::The version bump does not rebase onto origin/$TARGET — package.json changed on the branch after this release was cut. Resolve it by hand and re-run; forcing the push would drop those commits."
             exit 1
           fi
           if [ "$DIRTY" = 1 ]; then
             git stash pop > /dev/null || echo "::warning::the packaging changes could not be restored (git stash pop); the publish will use the tree as it is"
           fi

           git push https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/${{ github.repository }} HEAD:"$TARGET"
           git tag -f "$TAG"
           git push -f origin "$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check the PeroNPM login
        if: ${{ steps.channels.outputs.DO_PERONPM == 'true' }}
        run: |
          # The login lives in the job user's own ~/.npmrc, done once by hand on
          # the runner. Reading /root/.npmrc (what this step used to do) can only
          # ever print "No such file": the job does not run as root, and that made
          # a missing login look exactly like a broken registry.
          if [ -f "$HOME/.npmrc" ]; then
            echo "found $HOME/.npmrc; registries with credentials:"
            grep -oE '^//[^:]+:' "$HOME/.npmrc" || true
          else
            echo "::warning::no $HOME/.npmrc — npm login has not been run for $(id -un) on this runner"
          fi
          # Fails loudly now rather than after three retries of the real publish.
          npm whoami --registry "$NPM_URL" || echo "::warning::npm whoami failed — the PeroNPM publish will fail the same way"

      - name: Publish to PeroNPM
        if: ${{ steps.channels.outputs.DO_PERONPM == 'true' }}
        run: |
          for i in {1..3}; do
            npm publish --registry "$NPM_URL" --verbose && exit 0
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      # Everything this run built, in one artifact: the tarball the other registry
      # publishes, the packages NuGet receives, and — for the first release of a
      # package that has no trusted publisher yet — the exact bytes to publish by
      # hand, once, rather than a second build of them.
      - name: Collect the packages
        run: |
          rm -rf publish-artifacts
          mkdir -p publish-artifacts
          # npm will not create the destination; an old tarball left there would be
          # uploaded as this release's.
          rm -rf "$RUNNER_TEMP/npm"
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm" > /dev/null
          cp "$RUNNER_TEMP"/npm/*.tgz publish-artifacts/
          shopt -s nullglob
          nupkgs=("$RUNNER_TEMP"/nuget/*.nupkg)
          if [ ${#nupkgs[@]} -gt 0 ]; then
            cp "${nupkgs[@]}" publish-artifacts/
          fi
          ls -l publish-artifacts

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: publish-packages
          path: ${{ github.workspace }}/${{ inputs.working-directory }}/publish-artifacts/
          if-no-files-found: error

      - name: Clean up the ci_cd checkout
        if: always() && github.actor != 'perotoolsbot[bot]'
        run: |
          rm -rf "$RUNNER_TEMP/devops"
          rm -rf "$RUNNER_TEMP/npm" "$RUNNER_TEMP/nuget"
          rm -rf publish-artifacts

  # The two registries that are not ours, published from a GitHub-hosted runner:
  # npm trusted publishing does not accept self-hosted runners, and both channels
  # need the OIDC token this job asks for itself. No credential is passed in — npm
  # and nuget.org exchange this job's identity for a short-lived one.
  external:
    needs: publish
    if: ${{ needs.publish.outputs.npmjs == 'true' || needs.publish.outputs.nuget == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: publish-packages
          path: packages

      # Which repository and workflow file a trusted publisher has to name. The
      # claims are decoded from the OIDC token this job can mint, so the answer is
      # what the registry actually sees rather than what the workflow appears to be.
      - name: Report the identity this job publishes under
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::This job has no OIDC token, so neither registry can be authenticated."
            echo "::error::The workflow that calls this one must grant it — a called workflow cannot grant itself permission the caller did not give:"
            echo "::error::    jobs:"
            echo "::error::      call-publish:"
            echo "::error::        permissions:"
            echo "::error::          contents: write"
            echo "::error::          id-token: write"
            exit 1
          fi
          response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          token=$(printf '%s' "$response" | jq -r .value)
          # Only the payload is printed — the token itself is a credential and is
          # not logged, but its claims are exactly what the registry validates.
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | base64 -d | jq '{
            repository, repository_owner, workflow, workflow_ref, job_workflow_ref,
            runner_environment, event_name, ref
          }'
          ls -l packages

      - name: Setup Node.js
        if: ${{ needs.publish.outputs.npmjs == 'true' }}
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm 11.5.1 or newer, which the node the
          # self-hosted job uses does not ship. The version is checked below rather
          # than assumed to be new enough.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npmjs
        if: ${{ needs.publish.outputs.npmjs == 'true' }}
        run: |
          # Without this token npm can only answer ENEEDAUTH, which names neither
          # the missing permission nor the workflow that has to grant it.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token in this job, so registry.npmjs.org cannot be authenticated: the workflow that calls this one must grant 'id-token: write' to the calling job."
            exit 1
          fi
          # npm's trusted publishing needs npm 11.5.1 or newer; the images move, so
          # the version is checked and raised here instead of assumed.
          npm_version() { npm --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1; }
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]; }
          current=$(npm_version)
          echo "node $(node --version), npm ${current:-unknown}"
          if [ -z "$current" ] || ! at_least "$current" 11.5.1; then
            echo "npm ${current:-unknown} is older than 11.5.1; installing a newer one"
            npm install --global npm@^11 > /dev/null 2>&1 || npm install --global npm@latest > /dev/null 2>&1 || true
            current=$(npm_version)
            echo "now npm ${current:-unknown}"
          fi
          if [ -z "$current" ] || ! at_least "$current" 11.5.1; then
            echo "::error::npm ${current:-unknown} is still older than 11.5.1, which npm trusted publishing requires."
            exit 1
          fi

          shopt -s nullglob
          tarballs=(packages/*.tgz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one packed tarball in packages/, found ${#tarballs[@]}."
            exit 1
          fi
          tarball="${tarballs[0]}"

          # npm refuses a trusted publish whose package.json repository.url does not
          # name this repository (E422), and its message talks about provenance
          # instead of the field. Say it plainly before npm gets there.
          repository_url=$(tar -xOf "$tarball" package/package.json 2>/dev/null | tr -d '\n' \
            | sed -n 's/.*"repository": *{[^}]*"url": *"\([^"]*\)".*/\1/p')
          case "$repository_url" in
            *"github.com/${GITHUB_REPOSITORY}"*) echo "package.json repository.url: $repository_url" ;;
            "")
              echo "::warning::package.json has no repository.url; npm trusted publishing needs one naming https://github.com/${GITHUB_REPOSITORY}." ;;
            *)
              echo "::warning::package.json repository.url is '$repository_url', which does not name https://github.com/${GITHUB_REPOSITORY}; npm refuses that publish (E422)." ;;
          esac

          echo "publishing $(basename "$tarball") to registry.npmjs.org"
          for i in {1..3}; do
            npm publish "$tarball" --registry https://registry.npmjs.org/ && exit 0
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      # Requested right before the push: nuget.org hands out a key valid for one
      # hour and usable once, and an early one expires before the packages arrive.
      - name: NuGet login
        id: nuget_login
        if: ${{ needs.publish.outputs.nuget == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget-user }}

      - name: Push the NuGet packages
        if: ${{ needs.publish.outputs.nuget == 'true' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ inputs.nuget-source }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::nuget.org returned no API key — its trusted publishing policy must name the repository and the workflow file reported above."
            exit 1
          fi
          shopt -s nullglob
          packages=(packages/*.nupkg)
          # A step that pushes nothing must not report success — the pack step
          # already refuses an empty output directory, so reaching this with none
          # means the two jobs disagree about where the packages are.
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::There is no .nupkg in packages/ to push."
            exit 1
          fi
          for package in "${packages[@]}"; do
            echo "pushing $(basename "$package") to $NUGET_SOURCE"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              # `--skip-duplicate` makes a re-run of the same release succeed: the
              # version is already there and there is nothing to push.
              if dotnet nuget push "$package" --source "$NUGET_SOURCE" \
                   --api-key "$NUGET_API_KEY" --skip-duplicate; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not push $(basename "$package") to $NUGET_SOURCE after 3 attempts."
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 5 seconds..."
              attempt=$((attempt + 1))
              sleep 5
            done
          done

  # Only after every channel that ran came out green, and only for a `-base` tag:
  # the variants are not releases anyone announces.
  notify:
    needs: [publish, external]
    if: >-
      ${{ !cancelled()
          && needs.publish.result == 'success'
          && (needs.external.result == 'success' || needs.external.result == 'skipped')
          && endsWith(github.ref_name, '-base') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate token via GitHub App
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          repositories: ToolsWorkflow

      - name: Check out the notification script
        uses: actions/checkout@v4
        with:
          repository: peroperogames/ToolsWorkflow
          token: ${{ steps.generate_token.outputs.token }}
          path: tools
          sparse-checkout: publish

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES=$(gh release view "$TAG" --json body --jq .body)
          README_URL="https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md"
          bash tools/publish/feishu_webhook.sh "$FEISHU_WEBHOOK" "$FEISHU_SECRET" "$PROJECT_NAME" "$TAG" "$RELEASE_NOTES" "$README_URL"
