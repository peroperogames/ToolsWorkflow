name: Publish NPM Package (Reusable)

on:
  workflow_call:
    # 可选的输入参数
    inputs:
      expected-package-prefix:
        description: 'Expected package name prefix (used in scripts)'
        required: false
        type: string
        default: 'com.prpr'
    # 组织仓库 Secrets
    secrets:
      BACKEND_AC_TOKEN:
        required: true   # Clone token
      NPM_URL:
        required: true   # 私有 npm 仓库地址
      NPM_PASSWD:
        required: true   # npm 密码
      NPM_EMAIL:
        required: true   # npm 邮箱

jobs:
  publish:
    # Labels
    runs-on: [build-server, unitypkg-share]
    
    env:
      EXPECTED_PACKAGE_PREFIX: ${{ inputs.expected-package-prefix || 'com.prpr' }}
      # 将 secrets 转为环境变量，方便后续 shell 使用
      BACKEND_AC_TOKEN: ${{ secrets.BACKEND_AC_TOKEN }}
      NPM_URL: ${{ secrets.NPM_URL }}

    steps:
      # 1. 检出当前仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取所有历史，确保 tag 信息完整

      # 2. 克隆 ci_cd 脚本仓库
      - name: Clone ci_cd repository
        run: |
          mkdir -p /devops
          cd /devops
          git config --global url."https://oauth2:${BACKEND_AC_TOKEN}@github.com".insteadOf "https://github.com"
          git clone https://github.com/peroperogames/ToolsWorkflow.git

      # 3. 执行 changefoldername.sh
      - name: Change folder name
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
        run: |
          bash /devops/ToolsWorkflow/changefoldername.sh

      # 4. 执行 package.json 预处理脚本
      - name: Package preprocess
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          EXPECTED_PACKAGE_PREFIX: ${{ vars.EXPECTED_PACKAGE_PREFIX }}
        run: |
          sh /devops/ToolsWorkflow/package_preprocess.sh

      # 5. 显示 .npmrc 内容
      - name: Show .npmrc
        run: |
          echo "==== show /root/.npmrc ===="
          cat /root/.npmrc || echo "No /root/.npmrc"
          echo "==== show project .npmrc ===="
          cat .npmrc || echo "no project .npmrc"

      # 6. 验证当前登录用户
      - name: Test npm whoami
        run: npm whoami --registry "$NPM_URL"

      # 7. 发布到 npm
      - name: Publish with retry
        run: |
          for i in {1..3}; do
            npm publish --registry "$NPM_URL" --verbose && exit 0
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      # 8. 清理临时目录（无论成功失败都执行）
      - name: Clean up /devops
        if: always()
        run: rm -rf /devops
